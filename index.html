
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Study Planner</h1>
        <p>Plan your day. Achieve your goals.</p>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Welcome Back! 👋</h2>
            <p>Let's make today productive.</p>
        </section>

        <section class="stats">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

        </section>

        <section class="task-section">

            <h2>My Study Tasks</h2>

            <div class="task-form">
                <input type="text" id="taskInput"
                    placeholder="Enter your study task">

                <input type="text" id="subjectInput"
                    placeholder="Enter subject">

                <input type="date" id="dateInput">

                <button id="addTaskBtn">Add Task</button>
            </div>

            <div id="taskList"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
